name: helpi
publish_to: none
description: Helpi — a secure humanitarian assistance app.
version: 3.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.2
  intl: ^0.20.3
  image_picker: ^1.1.2
  video_player: ^2.9.2
  local_auth: ^2.3.0

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/helpi_logo.png
    - lib/data/countries.json
