services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: helpi
      POSTGRES_USER: helpi
      POSTGRES_PASSWORD: change-this-password
    ports: ["5432:5432"]
    volumes: [helpi_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpi -d helpi"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [helpi_redis:/data]
volumes:
  helpi_pg: {}
  helpi_redis: {}
